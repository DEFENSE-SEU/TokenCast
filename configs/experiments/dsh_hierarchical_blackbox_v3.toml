config_id = "dsh-hierarchical-blackbox-v3-v5"
schema_version = 2
workspace = "workspace"
seed = 20260719


[collection]
source = "dsh_session_observer_v3"
dataset = "hierarchical"
descriptor_path = "configs/source_descriptors/dsh_session_observer_v3.json"

[split]
unit = "task_id"
folds = 5

[interval]
alpha = 0.10
calibrator = "task_max_conformal"

[feature_sets.none]
include_all = false

[feature_sets.task_length]
include_all = false
include_features = ["task_char_count"]

[feature_sets.request_length_only]
include_all = false
include_features = ["current_request_tokens_local"]

[feature_sets.blackbox]
include_all = true
exclude_subgroups = ["raw_text", "context_text", "entropy_stop", "hidden_state", "stream_clock"]

[feature_sets.generation_accounting]
include_all = false
include_features = [
  "attempt_accounting_prior_q05",
  "attempt_accounting_prior_q50",
  "attempt_accounting_prior_q95",
]

[feature_sets.fixed_byte_token_progress]
include_all = false
include_features = [
  "observer_generation_bytes",
  "generation_unit_contract_id",
  "provider_token_unit_contract_id",
  "attempt_initializer_q05",
  "attempt_initializer_q50",
  "attempt_initializer_q95",
]

[[candidates]]
id = "empirical_quantile"
estimator = "empirical_quantile"
feature_set = "none"
role = "baseline"

[candidates.params]
alpha = 0.10

[[candidates]]
id = "task_text_length"
estimator = "length_only"
feature_set = "task_length"
role = "baseline"

[candidates.params]
feature_name = "task_char_count"
alpha = 0.10

[[candidates]]
id = "request_local_length"
estimator = "length_only"
feature_set = "request_length_only"
role = "baseline"

[candidates.params]
feature_name = "current_request_tokens_local"
alpha = 0.10

[[candidates]]
id = "request_local_bucket_quantile"
estimator = "bucket_quantile"
feature_set = "request_length_only"
role = "baseline"

[candidates.params]
feature_name = "current_request_tokens_local"
n_buckets = 8
min_bucket_tasks = 3
alpha = 0.10

[[candidates]]
id = "request_local_residual_quantile"
estimator = "additive_residual_quantile"
feature_set = "request_length_only"
role = "baseline"

[candidates.params]
feature_name = "current_request_tokens_local"
alpha = 0.10

[[candidates]]
id = "point_mlp"
estimator = "independent_mlp"
feature_set = "blackbox"
role = "model"

[candidates.params]
hidden_dims = [128, 64]
learning_rate = 0.001
weight_decay = 0.0001
max_epochs = 100
patience = 12
output_transform = "direct_quantiles"
training_device = "cpu"

[[candidates]]
id = "generation_accounting_prior"
estimator = "quantile_features"
feature_set = "generation_accounting"
role = "baseline"

[candidates.params]
lower_feature = "attempt_accounting_prior_q05"
point_feature = "attempt_accounting_prior_q50"
upper_feature = "attempt_accounting_prior_q95"

[candidates.initializer_params]
alpha = 0.10

[candidates.graph]
initializer = "empirical_quantile"
updater = "quantile_features"
lifecycle_schema = "attempt_generation_residual_v1"
seed_policy = "inner_oof_uncalibrated_repaired_quantile_mean_v1"
inner_split_policy = "task_multicohort_balanced_inner_oof_v2"

[[candidates]]
id = "generation_fixed_byte_token_progress"
estimator = "fixed_byte_token_progress"
feature_set = "fixed_byte_token_progress"
role = "baseline"

[candidates.params]
alpha = 0.10

[candidates.initializer_params]
alpha = 0.10

[candidates.graph]
initializer = "empirical_quantile"
updater = "fixed_byte_token_progress"
lifecycle_schema = "attempt_generation_residual_v1"
seed_policy = "inner_oof_uncalibrated_repaired_quantile_mean_v1"
inner_split_policy = "task_multicohort_balanced_inner_oof_v2"


[[candidates]]
id = "generation_byte_hazard"
estimator = "proportional_hazard"
feature_set = "blackbox"
role = "model"

[candidates.params]
n_bins = 32
iterations = 60
learning_rate = 0.10
l2 = 0.001
alpha = 0.10

[candidates.initializer_params]
alpha = 0.10

[candidates.graph]
initializer = "empirical_quantile"
updater = "proportional_hazard"
lifecycle_schema = "attempt_generation_residual_v1"
seed_policy = "inner_oof_uncalibrated_repaired_quantile_mean_v1"
inner_split_policy = "task_multicohort_balanced_inner_oof_v2"


[[candidates]]
id = "generation_residual_mlp"
estimator = "independent_mlp"
feature_set = "blackbox"
role = "model"

[candidates.params]
hidden_dims = [128, 64]
learning_rate = 0.001
weight_decay = 0.0001
max_epochs = 100
patience = 12
output_transform = "attempt_accounting_residual"
residual_scale = 1.0
