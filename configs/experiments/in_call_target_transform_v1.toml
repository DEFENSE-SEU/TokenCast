config_id = "in-call-target-transform-v1"
schema_version = 2
workspace = "workspace"
seed = 20260719

[collection]
source = "dsh_session_observer_v2"
dataset = "hierarchical"
descriptor_path = "configs/source_descriptors/dsh_session_observer_v2.json"

[split]
unit = "task_id"
folds = 5

[interval]
alpha = 0.10
calibrator = "task_max_conformal"


[feature_sets.none]
include_all = false

[feature_sets.in_call_tail_word]
include_all = false
include_subgroups = [
  "cumulative_history",
  "current_progress",
  "token_history",
  "progress_change",
]
include_features = [
  "generation_prefix_embedding",
  "generation_prefix_tail_embedding",
]
exclude_features = ["last_call_argument_chars", "last_call_observation_chars"]

[[candidates]]
id = "empirical_quantile"
estimator = "empirical_quantile"
feature_set = "none"
role = "baseline"

[candidates.params]
alpha = 0.10

[[candidates]]
id = "in_call_tail_bag"
estimator = "lightgbm_quantile"
feature_set = "in_call_tail_word"
role = "model"

[candidates.params]
num_boost_round = 300
early_stopping_rounds = 30
learning_rate = 0.03
num_leaves = 15
min_data_in_leaf = 10
max_depth = 6
lambda_l2 = 1.0
feature_fraction = 1.0
bagging_fraction = 0.8
bagging_freq = 1

[[candidates]]
id = "in_call_offset"
estimator = "lightgbm_quantile"
feature_set = "in_call_tail_word"
role = "ablation"

[candidates.params]
target_offset_feature = "observer_committed_tokens"
num_boost_round = 300
early_stopping_rounds = 30
learning_rate = 0.03
num_leaves = 15
min_data_in_leaf = 10
max_depth = 6
lambda_l2 = 1.0
feature_fraction = 1.0
bagging_fraction = 0.8
bagging_freq = 1

[candidates.ablation]
reference_candidate_id = "in_call_tail_bag"
axis = "method"
allowed_config_paths = ["params.target_offset_feature"]

[[candidates]]
id = "in_call_log1p"
estimator = "lightgbm_quantile"
feature_set = "in_call_tail_word"
role = "ablation"

[candidates.params]
target_transform = "log1p"
num_boost_round = 300
early_stopping_rounds = 30
learning_rate = 0.03
num_leaves = 15
min_data_in_leaf = 10
max_depth = 6
lambda_l2 = 1.0
feature_fraction = 1.0
bagging_fraction = 0.8
bagging_freq = 1

[candidates.ablation]
reference_candidate_id = "in_call_tail_bag"
axis = "method"
allowed_config_paths = ["params.target_transform"]

[[candidates]]
id = "in_call_offset_log1p"
estimator = "lightgbm_quantile"
feature_set = "in_call_tail_word"
role = "ablation"

[candidates.params]
target_offset_feature = "observer_committed_tokens"
target_transform = "log1p"
num_boost_round = 300
early_stopping_rounds = 30
learning_rate = 0.03
num_leaves = 15
min_data_in_leaf = 10
max_depth = 6
lambda_l2 = 1.0
feature_fraction = 1.0
bagging_fraction = 0.8
bagging_freq = 1

[candidates.ablation]
reference_candidate_id = "in_call_tail_bag"
axis = "method"
allowed_config_paths = ["params.target_offset_feature", "params.target_transform"]

[[experiments]]
id = "in_call_update"
position = "call_update"
target = "attempt_observer_remaining_visible_output_tokens"
candidates = ["empirical_quantile", "in_call_tail_bag", "in_call_offset", "in_call_log1p", "in_call_offset_log1p"]
required_features = ["task_char_count"]
