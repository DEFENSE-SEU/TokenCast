config_id = "four-position-calibrator-point-width-scaled-q50-v1"
schema_version = 2
workspace = "workspace"
seed = 20260719


[collection]
source = "dsh_session_observer_v2"
dataset = "hierarchical"
descriptor_path = "configs/source_descriptors/dsh_session_observer_v2.json"

[split]
unit = "task_id"
folds = 5

[interval]
alpha = 0.5
calibrator = "point_width_scaled_conformal"

[feature_sets.none]
include_all = false

[feature_sets.task_text]
include_all = false
include_features = ["task_text"]

[feature_sets.task_length]
include_all = false
include_features = ["task_char_count"]

[feature_sets.issue_length]
include_all = false
include_features = ["task_issue_char_count"]

[feature_sets.difficulty]
include_all = false
include_features = ["task_difficulty_ordinal"]

[feature_sets.request_messages]
include_all = false
include_features = ["request_message_count"]

[feature_sets.call_index]
include_all = false
include_features = ["completed_call_count"]

[feature_sets.previous_output]
include_all = false
include_features = ["last_call_output_tokens"]

[feature_sets.recent_output_5]
include_all = false
include_features = ["mean_output_tokens_5"]

[feature_sets.recent_output_10]
include_all = false
include_features = ["mean_output_tokens_10"]

[feature_sets.prefix_tokens]
include_all = false
include_features = ["observer_committed_tokens"]

[feature_sets.generation_accounting]
include_all = false
include_features = [
  "attempt_accounting_prior_q05",
  "attempt_accounting_prior_q50",
  "attempt_accounting_prior_q95",
]


[feature_sets.six_full]
include_all = false
include_subgroups = [
  "initial_info",
  "cumulative_history",
  "current_progress",
  "progress_change",
  "failure_stall",
  "token_history",
]

[feature_sets.call_start_ours]
include_all = false
include_subgroups = ["current_progress", "token_history", "progress_change"]
exclude_features = [
  "last_call_edit_result_chars",
  "last_call_run_result_chars",
  "last_call_test_result_chars",
  "last_call_tracking_result_chars",
  "last_call_unique_path_count",
  "last_call_path_revisit_count",
  "last_call_observation_lines",
  "last_call_partial_result_count",
  "last_call_diagnostic_line_count",
]


[feature_sets.in_call_prefix]
include_all = false
include_subgroups = ["cumulative_history", "current_progress", "token_history", "progress_change"]
include_features = ["generation_prefix_embedding"]
exclude_features = ["last_call_argument_chars", "last_call_observation_chars"]

[feature_sets.in_call_ours]
include_all = false
include_subgroups = [
  "cumulative_history",
  "current_progress",
  "token_history",
  "progress_change",
  "prefix_closure",
  "session_recall",
]
include_features = ["generation_prefix_embedding"]
exclude_features = ["last_call_argument_chars", "last_call_observation_chars"]

[feature_sets.in_call_ours_clock]
include_all = false
include_subgroups = [
  "cumulative_history",
  "current_progress",
  "token_history",
  "progress_change",
  "prefix_closure",
  "session_recall",
  "stream_clock",
]
include_features = ["generation_prefix_embedding"]
exclude_features = ["last_call_argument_chars", "last_call_observation_chars"]

[feature_sets.task_update_ours]
include_all = false
include_subgroups = [
  "cumulative_history",
  "current_progress",
  "failure_stall",
  "token_history",
  "progress_change",
]
exclude_features = [
  "last_call_read_result_chars",
  "last_call_edit_result_chars",
  "last_call_run_result_chars",
  "last_call_test_result_chars",
  "last_call_tracking_result_chars",
  "last_call_unique_path_count",
  "last_call_path_revisit_count",
  "last_call_observation_lines",
  "last_call_partial_result_count",
  "last_call_diagnostic_line_count",
]

[[candidates]]
id = "call_start__cal"
estimator = "lightgbm_quantile"
feature_set = "call_start_ours"
role = "model"

[candidates.params]
num_boost_round = 300
early_stopping_rounds = 30
learning_rate = 0.03
num_leaves = 15
min_data_in_leaf = 10
max_depth = 6
lambda_l2 = 1.0
feature_fraction = 1.0
bagging_fraction = 1.0
bagging_freq = 0

[[candidates]]
id = "in_call_visible__cal"
estimator = "lightgbm_quantile"
feature_set = "in_call_ours"
role = "model"

[candidates.params]
num_boost_round = 300
early_stopping_rounds = 30
learning_rate = 0.03
num_leaves = 15
min_data_in_leaf = 10
max_depth = 6
lambda_l2 = 1.0
feature_fraction = 1.0
bagging_fraction = 1.0
bagging_freq = 0

