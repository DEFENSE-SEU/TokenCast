bagging_freq = 0

[[candidates]]
id = "task_update__cal"
estimator = "lightgbm_quantile"
feature_set = "task_update_ours"
role = "model"

[candidates.params]
num_boost_round = 300
early_stopping_rounds = 30
learning_rate = 0.03
num_leaves = 15
min_data_in_leaf = 10
max_depth = 6
lambda_l2 = 1.0
feature_fraction = 1.0
bagging_fraction = 1.0
bagging_freq = 0

[[experiments]]
id = "call_start"
position = "call_pre"
target = "call_billable_output_tokens"
token_unit_contract_id = "provider:dsh-outputTokens-v1:openai-codex:gpt-5.4"
candidates = [
  "call_start__cal",
]

[[experiments]]
id = "in_call_visible"
position = "call_update"
target = "attempt_observer_remaining_visible_output_tokens"
token_unit_contract_id = "observer:utf8-bytes-v1"
