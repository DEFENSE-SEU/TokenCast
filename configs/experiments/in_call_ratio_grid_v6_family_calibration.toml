config_id = "in-call-ratio-grid-v6-family-calibration"
schema_version = 2
workspace = "workspace"
seed = 20260719


[collection]
source = "dsh_session_observer_v2"
dataset = "hierarchical"
descriptor_path = "configs/source_descriptors/dsh_session_observer_v2.json"

[split]
unit = "task_id"
folds = 5

[interval]
alpha = 0.10
calibrator = "family_sampled_point_conformal"

[feature_sets.none]
include_all = false

[feature_sets.in_call_closure_recall]
include_all = false
include_subgroups = ["cumulative_history", "current_progress", "token_history", "progress_change", "prefix_closure", "session_recall"]
include_features = ["generation_prefix_embedding"]
exclude_features = ["last_call_argument_chars", "last_call_observation_chars"]

[[candidates]]
id = "empirical_quantile"
estimator = "empirical_quantile"
feature_set = "none"
role = "baseline"

[candidates.params]
alpha = 0.10

[[candidates]]
id = "in_call_cs"
estimator = "lightgbm_quantile"
feature_set = "in_call_closure_recall"
role = "model"

[candidates.params]
num_boost_round = 300
early_stopping_rounds = 30
learning_rate = 0.03
num_leaves = 15
min_data_in_leaf = 10
max_depth = 6
lambda_l2 = 1.0
feature_fraction = 1.0
bagging_fraction = 1.0
bagging_freq = 0

[[candidates]]
id = "rg_tilt_sharpen"
estimator = "ratio_grid"
feature_set = "in_call_closure_recall"
role = "model"

[candidates.params]
n_intervals = 128
hidden_dim = 64
learning_rate = 0.001
weight_decay = 0.0001
batch_size = 256
max_rounds = 60
epochs_per_round = 1
patience = 10
replay_folds = 3
recursive = false
initializer = "lightgbm_quantile"
initializer_mix = 0.01
scorer = "tilt"
tilt_curvature = "nonpositive"

[candidates.params.initializer_params]
num_boost_round = 300
early_stopping_rounds = 30
learning_rate = 0.03
num_leaves = 15
min_data_in_leaf = 10
max_depth = 6
lambda_l2 = 1.0
feature_fraction = 1.0
bagging_fraction = 1.0
bagging_freq = 0

[[candidates]]
id = "rg_tilt_free"
estimator = "ratio_grid"
feature_set = "in_call_closure_recall"
role = "ablation"

[candidates.params]
n_intervals = 128
hidden_dim = 64
learning_rate = 0.001
weight_decay = 0.0001
batch_size = 256
max_rounds = 60
epochs_per_round = 1
patience = 10
replay_folds = 3
recursive = false
initializer = "lightgbm_quantile"
initializer_mix = 0.01
scorer = "tilt"
tilt_curvature = "free"

[candidates.params.initializer_params]
num_boost_round = 300
early_stopping_rounds = 30
learning_rate = 0.03
num_leaves = 15
