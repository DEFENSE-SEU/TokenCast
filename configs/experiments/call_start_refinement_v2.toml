config_id = "call-start-refinement-v2"
schema_version = 2
workspace = "workspace"
seed = 20260719

[collection]
source = "dsh_session_observer_v2"
dataset = "hierarchical"
descriptor_path = "configs/source_descriptors/dsh_session_observer_v2.json"

[split]
unit = "task_id"
folds = 5

[interval]
alpha = 0.10
calibrator = "task_max_conformal"

[feature_sets.none]
include_all = false

[feature_sets.call_current]
include_all = false
include_subgroups = [
  "initial_info",
  "current_progress",
  "failure_stall",
  "token_history",
  "progress_change",
]

[feature_sets.call_dynamic]
include_all = false
include_subgroups = [
  "current_progress",
  "failure_stall",
  "token_history",
  "progress_change",
]

[feature_sets.call_dynamic_no_stall]
include_all = false
include_subgroups = [
  "current_progress",
  "token_history",
  "progress_change",
]

[[candidates]]
id = "empirical_quantile"
estimator = "empirical_quantile"
feature_set = "none"
role = "baseline"

[candidates.params]
alpha = 0.10

[[candidates]]
id = "call_current"
estimator = "lightgbm_quantile"
feature_set = "call_current"
role = "model"

[candidates.params]
num_boost_round = 300
early_stopping_rounds = 30
learning_rate = 0.03
num_leaves = 15
min_data_in_leaf = 10
max_depth = 6
lambda_l2 = 1.0
feature_fraction = 1.0
bagging_fraction = 1.0
bagging_freq = 0

[[candidates]]
id = "call_dynamic"
estimator = "lightgbm_quantile"
feature_set = "call_dynamic"
role = "ablation"

[candidates.params]
num_boost_round = 300
early_stopping_rounds = 30
learning_rate = 0.03
num_leaves = 15
min_data_in_leaf = 10
max_depth = 6
lambda_l2 = 1.0
feature_fraction = 1.0
bagging_fraction = 1.0
bagging_freq = 0

[candidates.ablation]
reference_candidate_id = "call_current"
axis = "feature_set"
allowed_config_paths = ["feature_set"]

[[candidates]]
id = "call_dynamic_no_stall"
estimator = "lightgbm_quantile"
feature_set = "call_dynamic_no_stall"
role = "ablation"

[candidates.params]
num_boost_round = 300
early_stopping_rounds = 30
learning_rate = 0.03
num_leaves = 15
min_data_in_leaf = 10
max_depth = 6
lambda_l2 = 1.0
feature_fraction = 1.0
bagging_fraction = 1.0
bagging_freq = 0

[candidates.ablation]
reference_candidate_id = "call_current"
axis = "feature_set"
allowed_config_paths = ["feature_set"]

[[candidates]]
id = "call_current_regularized"
estimator = "lightgbm_quantile"
feature_set = "call_current"
role = "ablation"

[candidates.params]
num_boost_round = 300
early_stopping_rounds = 30
learning_rate = 0.03
num_leaves = 7
min_data_in_leaf = 20
max_depth = 3
lambda_l2 = 5.0
feature_fraction = 1.0
bagging_fraction = 1.0
bagging_freq = 0

[candidates.ablation]
reference_candidate_id = "call_current"
axis = "method"
allowed_config_paths = [
  "params.num_leaves",
  "params.min_data_in_leaf",
  "params.max_depth",
  "params.lambda_l2",
]

[[candidates]]
id = "call_dynamic_regularized"
estimator = "lightgbm_quantile"
feature_set = "call_dynamic_no_stall"
role = "ablation"

[candidates.params]
num_boost_round = 300
early_stopping_rounds = 30
learning_rate = 0.03
num_leaves = 7
min_data_in_leaf = 20
max_depth = 3
lambda_l2 = 5.0
feature_fraction = 1.0
bagging_fraction = 1.0
bagging_freq = 0

[candidates.ablation]
reference_candidate_id = "call_current"
axis = "method"
allowed_config_paths = [
  "feature_set",
  "params.num_leaves",
  "params.min_data_in_leaf",
  "params.max_depth",
  "params.lambda_l2",
]

[[experiments]]
id = "call_start"
position = "call_pre"
target = "call_billable_output_tokens"
candidates = [
  "empirical_quantile",
  "call_current",
  "call_dynamic",
  "call_dynamic_no_stall",
  "call_current_regularized",
  "call_dynamic_regularized",
]
required_features = ["task_char_count"]
