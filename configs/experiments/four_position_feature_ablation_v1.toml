config_id = "four-position-feature-ablation-v1"
schema_version = 2
workspace = "workspace"
seed = 20260719

[collection]
source = "dsh_session_observer_v2"
dataset = "hierarchical"
descriptor_path = "configs/source_descriptors/dsh_session_observer_v2.json"

[split]
unit = "task_id"
folds = 5

[interval]
alpha = 0.10
calibrator = "task_max_conformal"

[feature_sets.none]
include_all = false

[feature_sets.task_length]
include_all = false
include_features = ["task_char_count"]

[feature_sets.current_blackbox]
include_all = true
exclude_subgroups = [
  "raw_text",
  "context_text",
  "entropy_stop",
  "hidden_state",
  "action_history",
  "progress_state",
  "token_history",
  "progress_delta",
  "stream_clock",
]
exclude_features = [
  "task_difficulty",
  "task_difficulty_ordinal",
  "task_issue_char_count",
  "task_issue_word_count",
  "task_list_item_count",
  "task_inline_code_count",
  "initial_tool_count",
  "cumulative_provider_reasoning_tokens",
  "last_call_failed_attempts",
  "last_call_retry_count",
  "recent_call_failure_rate_5",
  "recent_call_failure_rate_10",
  "recent_tool_failure_rate_5",
  "recent_tool_failure_rate_10",
  "recent_usage_missing_rate_5",
  "recent_usage_missing_rate_10",
  "consecutive_failed_calls",
  "consecutive_retry_calls",
  "consecutive_no_progress_calls",
  "observer_committed_change",
]

[feature_sets.six_full]
include_all = false
include_subgroups = [
  "initial_info",
  "cumulative_history",
  "current_progress",
  "failure_stall",
  "token_history",
  "progress_change",
]

[feature_sets.without_initial_info]
include_all = false
include_subgroups = [
  "cumulative_history",
  "current_progress",
  "failure_stall",
  "token_history",
  "progress_change",
]

[feature_sets.without_cumulative_history]
include_all = false
include_subgroups = [
  "initial_info",
  "current_progress",
  "failure_stall",
  "token_history",
  "progress_change",
]

[feature_sets.without_current_progress]
include_all = false
include_subgroups = [
  "initial_info",
  "cumulative_history",
  "failure_stall",
  "token_history",
  "progress_change",
]

[feature_sets.without_failure_stall]
include_all = false
include_subgroups = [
  "initial_info",
  "cumulative_history",
  "current_progress",
  "token_history",
  "progress_change",
]

[feature_sets.without_token_history]
include_all = false
include_subgroups = [
  "initial_info",
  "cumulative_history",
  "current_progress",
  "failure_stall",
  "progress_change",
]

[feature_sets.without_progress_change]
include_all = false
include_subgroups = [
  "initial_info",
  "cumulative_history",
  "current_progress",
  "failure_stall",
  "token_history",
]

[feature_sets.generation_accounting]
include_all = false
include_features = [
  "attempt_accounting_prior_q05",
  "attempt_accounting_prior_q50",
  "attempt_accounting_prior_q95",
]

[[candidates]]
id = "empirical_quantile"
estimator = "empirical_quantile"
feature_set = "none"
role = "baseline"

[candidates.params]
alpha = 0.10

[[candidates]]
id = "task_text_length"
estimator = "length_only"
feature_set = "task_length"
role = "baseline"

[candidates.params]
feature_name = "task_char_count"
