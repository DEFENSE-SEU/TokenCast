config_id = "previous-output-ablation-v1"
schema_version = 2
workspace = "workspace"
seed = 20260719


[collection]
source = "dsh_session_observer_v2"
dataset = "hierarchical"
descriptor_path = "configs/source_descriptors/dsh_session_observer_v2.json"

[split]
unit = "task_id"
folds = 5

[interval]
alpha = 0.10
calibrator = "point_conformal"

[feature_sets.none]
include_all = false

[feature_sets.cs_ref]
include_all = false
include_subgroups = ["current_progress", "token_history", "progress_change"]
exclude_features = [
  "last_call_edit_result_chars",
  "last_call_run_result_chars",
  "last_call_test_result_chars",
  "last_call_tracking_result_chars",
  "last_call_unique_path_count",
  "last_call_path_revisit_count",
  "last_call_observation_lines",
  "last_call_partial_result_count",
  "last_call_diagnostic_line_count",
]

[feature_sets.cs_with_previous_output]
include_all = false
include_subgroups = ["current_progress", "token_history", "progress_change", "previous_output"]
exclude_features = [
  "last_call_edit_result_chars",
  "last_call_run_result_chars",
  "last_call_test_result_chars",
  "last_call_tracking_result_chars",
  "last_call_unique_path_count",
  "last_call_path_revisit_count",
  "last_call_observation_lines",
  "last_call_partial_result_count",
  "last_call_diagnostic_line_count",
]

[feature_sets.cs_with_previous_output_length]
include_all = false
include_subgroups = ["current_progress", "token_history", "progress_change"]
include_features = ["last_output_char_count"]
exclude_features = [
  "last_call_edit_result_chars",
  "last_call_run_result_chars",
  "last_call_test_result_chars",
  "last_call_tracking_result_chars",
  "last_call_unique_path_count",
  "last_call_path_revisit_count",
  "last_call_observation_lines",
  "last_call_partial_result_count",
  "last_call_diagnostic_line_count",
]

[feature_sets.tu_ref]
include_all = false
include_subgroups = ["cumulative_history", "current_progress", "failure_stall", "token_history", "progress_change"]
exclude_features = [
  "last_call_read_result_chars",
  "last_call_edit_result_chars",
  "last_call_run_result_chars",
  "last_call_test_result_chars",
  "last_call_tracking_result_chars",
  "last_call_unique_path_count",
  "last_call_path_revisit_count",
  "last_call_observation_lines",
  "last_call_partial_result_count",
  "last_call_diagnostic_line_count",
]

[feature_sets.tu_with_previous_output]
include_all = false
include_subgroups = ["cumulative_history", "current_progress", "failure_stall", "token_history", "progress_change", "previous_output"]
exclude_features = [
  "last_call_read_result_chars",
  "last_call_edit_result_chars",
  "last_call_run_result_chars",
  "last_call_test_result_chars",
  "last_call_tracking_result_chars",
  "last_call_unique_path_count",
  "last_call_path_revisit_count",
  "last_call_observation_lines",
  "last_call_partial_result_count",
  "last_call_diagnostic_line_count",
]

[[candidates]]
id = "empirical"
estimator = "empirical_quantile"
feature_set = "none"
role = "baseline"

[candidates.params]
alpha = 0.10

[[candidates]]
id = "cs_ref"
estimator = "lightgbm_quantile"
feature_set = "cs_ref"
role = "model"

[candidates.params]
num_boost_round = 300
early_stopping_rounds = 30
learning_rate = 0.03
num_leaves = 15
min_data_in_leaf = 10
max_depth = 6
lambda_l2 = 1.0
feature_fraction = 1.0
bagging_fraction = 1.0
bagging_freq = 0

[[candidates]]
id = "cs_with_previous_output"
estimator = "lightgbm_quantile"
feature_set = "cs_with_previous_output"
role = "ablation"

[candidates.params]
num_boost_round = 300
early_stopping_rounds = 30
learning_rate = 0.03
num_leaves = 15
min_data_in_leaf = 10
max_depth = 6
lambda_l2 = 1.0
feature_fraction = 1.0
bagging_fraction = 1.0
bagging_freq = 0

[candidates.ablation]
reference_candidate_id = "cs_ref"
axis = "feature_set"
allowed_config_paths = ["feature_set"]

