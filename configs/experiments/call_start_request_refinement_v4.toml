config_id = "call-start-request-refinement-v4"
schema_version = 2
workspace = "workspace"
seed = 20260719

[collection]
source = "dsh_session_observer_v2"
dataset = "hierarchical"
descriptor_path = "configs/source_descriptors/dsh_session_observer_v2.json"

[split]
unit = "task_id"
folds = 5

[interval]
alpha = 0.10
calibrator = "task_max_conformal"

[feature_sets.none]
include_all = false

[feature_sets.call_history_content]
include_all = false
include_subgroups = ["current_progress", "token_history", "progress_change"]

[feature_sets.call_history_request]
include_all = false
include_subgroups = ["current_progress", "token_history", "progress_change"]
include_features = ["request_message_count"]

[[candidates]]
id = "empirical_quantile"
estimator = "empirical_quantile"
feature_set = "none"
role = "baseline"

[candidates.params]
alpha = 0.10

[[candidates]]
id = "call_history_content"
estimator = "lightgbm_quantile"
feature_set = "call_history_content"
role = "model"

[candidates.params]
num_boost_round = 300
early_stopping_rounds = 30
learning_rate = 0.03
num_leaves = 15
min_data_in_leaf = 10
max_depth = 6
lambda_l2 = 1.0
feature_fraction = 1.0
bagging_fraction = 1.0
bagging_freq = 0

[[candidates]]
id = "call_history_request"
estimator = "lightgbm_quantile"
feature_set = "call_history_request"
role = "ablation"

[candidates.params]
num_boost_round = 300
early_stopping_rounds = 30
learning_rate = 0.03
num_leaves = 15
min_data_in_leaf = 10
max_depth = 6
lambda_l2 = 1.0
feature_fraction = 1.0
bagging_fraction = 1.0
bagging_freq = 0

[candidates.ablation]
reference_candidate_id = "call_history_content"
axis = "feature_set"
allowed_config_paths = ["feature_set"]

[[experiments]]
id = "call_start"
position = "call_pre"
target = "call_billable_output_tokens"
candidates = [
  "empirical_quantile",
  "call_history_content",
  "call_history_request",
]
required_features = ["task_char_count"]
