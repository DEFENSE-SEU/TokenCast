config_id = "four-position-substitution-catboost-v1"
schema_version = 2
workspace = "workspace"
seed = 20260719


[collection]
source = "dsh_session_observer_v2"
dataset = "hierarchical"
descriptor_path = "configs/source_descriptors/dsh_session_observer_v2.json"

[split]
unit = "task_id"
folds = 5

[interval]
alpha = 0.10
calibrator = "point_conformal"

[feature_sets.call_start_ours]
include_all = false
include_subgroups = ["current_progress", "token_history", "progress_change"]
exclude_features = [
  "last_call_edit_result_chars",
  "last_call_run_result_chars",
  "last_call_test_result_chars",
  "last_call_tracking_result_chars",
  "last_call_unique_path_count",
  "last_call_path_revisit_count",
  "last_call_observation_lines",
  "last_call_partial_result_count",
  "last_call_diagnostic_line_count",
]

[feature_sets.in_call_ours_clock]
include_all = false
include_subgroups = [
  "cumulative_history",
  "current_progress",
  "token_history",
  "progress_change",
  "prefix_closure",
  "session_recall",
  "stream_clock",
]
include_features = ["generation_prefix_embedding"]
exclude_features = ["last_call_argument_chars", "last_call_observation_chars"]

[feature_sets.task_update_ours]
include_all = false
include_subgroups = [
  "cumulative_history",
  "current_progress",
  "failure_stall",
  "token_history",
  "progress_change",
]
exclude_features = [
  "last_call_read_result_chars",
  "last_call_edit_result_chars",
  "last_call_run_result_chars",
  "last_call_test_result_chars",
  "last_call_tracking_result_chars",
  "last_call_unique_path_count",
  "last_call_path_revisit_count",
  "last_call_observation_lines",
  "last_call_partial_result_count",
  "last_call_diagnostic_line_count",
]

[[candidates]]
id = "call_start__learner_catboost"
estimator = "catboost_quantile"
feature_set = "call_start_ours"
role = "model"

[candidates.params]
num_boost_round = 300
early_stopping_rounds = 20
learning_rate = 0.05
depth = 6
l2_leaf_reg = 3.0

[[candidates]]
id = "in_call_billed__learner_catboost"
estimator = "catboost_quantile"
feature_set = "in_call_ours_clock"
role = "model"

[candidates.params]
num_boost_round = 300
early_stopping_rounds = 20
learning_rate = 0.05
depth = 6
l2_leaf_reg = 3.0

[[candidates]]
id = "task_update__learner_catboost"
estimator = "catboost_quantile"
feature_set = "task_update_ours"
role = "model"

[candidates.params]
num_boost_round = 300
early_stopping_rounds = 20
learning_rate = 0.05
depth = 6
l2_leaf_reg = 3.0

[[experiments]]
id = "call_start"
position = "call_pre"
target = "call_billable_output_tokens"
token_unit_contract_id = "provider:dsh-outputTokens-v1:openai-codex:gpt-5.4"
candidates = ["call_start__learner_catboost"]

[[experiments]]
id = "in_call_billed"
position = "call_update"
target = "attempt_provider_final_output_tokens"
token_unit_contract_id = "provider:dsh-outputTokens-v1:openai-codex:gpt-5.4"
candidates = ["in_call_billed__learner_catboost"]

[[experiments]]
id = "task_update"
position = "task_update"
target = "task_provider_accounted_remaining_tokens"
token_unit_contract_id = "provider:dsh-outputTokens-v1:openai-codex:gpt-5.4"
candidates = ["task_update__learner_catboost"]
