config_id = "call-start-path-refinement-v11"
schema_version = 2
workspace = "workspace"
seed = 20260719

[collection]
source = "dsh_session_observer_v2"
dataset = "hierarchical"
descriptor_path = "configs/source_descriptors/dsh_session_observer_v2.json"

[split]
unit = "task_id"
folds = 5

[interval]
alpha = 0.10
calibrator = "task_max_conformal"

[feature_sets.none]
include_all = false

[feature_sets.call_base]
include_all = false
include_subgroups = ["current_progress", "token_history", "progress_change"]
exclude_features = [
  "last_call_edit_result_chars",
  "last_call_run_result_chars",
  "last_call_test_result_chars",
  "last_call_tracking_result_chars",
  "last_call_unique_path_count",
  "last_call_path_revisit_count",
]

[feature_sets.call_unique]
include_all = false
include_subgroups = ["current_progress", "token_history", "progress_change"]
exclude_features = [
  "last_call_edit_result_chars",
  "last_call_run_result_chars",
  "last_call_test_result_chars",
  "last_call_tracking_result_chars",
  "last_call_path_revisit_count",
]

[feature_sets.call_revisit]
include_all = false
include_subgroups = ["current_progress", "token_history", "progress_change"]
exclude_features = [
  "last_call_edit_result_chars",
  "last_call_run_result_chars",
  "last_call_test_result_chars",
  "last_call_tracking_result_chars",
  "last_call_unique_path_count",
]

[feature_sets.call_paths]
include_all = false
include_subgroups = ["current_progress", "token_history", "progress_change"]
exclude_features = [
  "last_call_edit_result_chars",
  "last_call_run_result_chars",
  "last_call_test_result_chars",
  "last_call_tracking_result_chars",
]

[[candidates]]
id = "empirical"
estimator = "empirical_quantile"
feature_set = "none"
role = "baseline"

[candidates.params]
alpha = 0.10

[[candidates]]
id = "call_base"
estimator = "lightgbm_quantile"
feature_set = "call_base"
role = "model"

[candidates.params]
num_boost_round = 300
early_stopping_rounds = 30
learning_rate = 0.03
num_leaves = 15
min_data_in_leaf = 10
max_depth = 6
lambda_l2 = 1.0
feature_fraction = 1.0
bagging_fraction = 1.0
bagging_freq = 0

[[candidates]]
id = "call_unique"
estimator = "lightgbm_quantile"
feature_set = "call_unique"
role = "ablation"

[candidates.params]
num_boost_round = 300
early_stopping_rounds = 30
learning_rate = 0.03
num_leaves = 15
min_data_in_leaf = 10
max_depth = 6
lambda_l2 = 1.0
feature_fraction = 1.0
bagging_fraction = 1.0
bagging_freq = 0

[candidates.ablation]
reference_candidate_id = "call_base"
axis = "feature_set"
allowed_config_paths = ["feature_set"]

[[candidates]]
id = "call_revisit"
estimator = "lightgbm_quantile"
feature_set = "call_revisit"
role = "ablation"

[candidates.params]
num_boost_round = 300
early_stopping_rounds = 30
learning_rate = 0.03
num_leaves = 15
min_data_in_leaf = 10
max_depth = 6
lambda_l2 = 1.0
feature_fraction = 1.0
bagging_fraction = 1.0
bagging_freq = 0

[candidates.ablation]
reference_candidate_id = "call_base"
axis = "feature_set"
allowed_config_paths = ["feature_set"]

[[candidates]]
id = "call_paths"
estimator = "lightgbm_quantile"
feature_set = "call_paths"
role = "ablation"

[candidates.params]
num_boost_round = 300
early_stopping_rounds = 30
learning_rate = 0.03
num_leaves = 15
min_data_in_leaf = 10
max_depth = 6
lambda_l2 = 1.0
feature_fraction = 1.0
bagging_fraction = 1.0
bagging_freq = 0

[candidates.ablation]
reference_candidate_id = "call_base"
axis = "feature_set"
allowed_config_paths = ["feature_set"]

[[experiments]]
id = "call_start"
position = "call_pre"
target = "call_billable_output_tokens"
candidates = ["empirical", "call_base", "call_unique", "call_revisit", "call_paths"]
required_features = ["task_char_count"]
