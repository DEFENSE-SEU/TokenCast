config_id = "four-position-billed-v1"
schema_version = 2
workspace = "workspace"
seed = 20260719


[collection]
source = "dsh_session_observer_v2"
dataset = "hierarchical"
descriptor_path = "configs/source_descriptors/dsh_session_observer_v2.json"

[split]
unit = "task_id"
folds = 5

[interval]
alpha = 0.10
calibrator = "task_max_conformal"


[feature_sets.none]
include_all = false

[feature_sets.task_launch_selected]
include_all = false
include_subgroups = ["initial_info"]

[feature_sets.call_start_selected]
include_all = false
include_subgroups = [
  "current_progress",
  "token_history",
  "progress_change",
]

[feature_sets.in_call_selected]
include_all = false
include_subgroups = [
  "cumulative_history",
  "current_progress",
  "token_history",
  "progress_change",
]
include_features = ["generation_prefix_embedding"]
exclude_features = ["last_call_argument_chars", "last_call_observation_chars"]

[feature_sets.in_call_clock]
include_all = false
include_subgroups = [
  "cumulative_history",
  "current_progress",
  "token_history",
  "progress_change",
  "stream_clock",
]
include_features = ["generation_prefix_embedding"]
exclude_features = ["last_call_argument_chars", "last_call_observation_chars"]

[feature_sets.task_update_selected]
include_all = false
include_subgroups = [
  "cumulative_history",
  "current_progress",
  "failure_stall",
  "token_history",
  "progress_change",
]

[[candidates]]
id = "empirical_quantile"
estimator = "empirical_quantile"
feature_set = "none"
role = "baseline"

[candidates.params]
alpha = 0.10

[[candidates]]
id = "task_launch_model"
estimator = "lightgbm_quantile"
feature_set = "task_launch_selected"
role = "model"

[candidates.params]
num_boost_round = 300
early_stopping_rounds = 30
learning_rate = 0.03
num_leaves = 15
min_data_in_leaf = 10
max_depth = 6
lambda_l2 = 1.0
feature_fraction = 1.0
bagging_fraction = 1.0
bagging_freq = 0

[[candidates]]
id = "call_start_model"
estimator = "lightgbm_quantile"
feature_set = "call_start_selected"
role = "model"

[candidates.params]
num_boost_round = 300
early_stopping_rounds = 30
learning_rate = 0.03
num_leaves = 15
min_data_in_leaf = 10
max_depth = 6
lambda_l2 = 1.0
feature_fraction = 1.0
bagging_fraction = 1.0
bagging_freq = 0

[[candidates]]
id = "in_call_model"
estimator = "lightgbm_quantile"
feature_set = "in_call_selected"
role = "model"

[candidates.params]
num_boost_round = 300
early_stopping_rounds = 30
learning_rate = 0.03
num_leaves = 15
min_data_in_leaf = 10
max_depth = 6
lambda_l2 = 1.0
feature_fraction = 1.0
bagging_fraction = 1.0
bagging_freq = 0

[[candidates]]
id = "in_call_clock"
estimator = "lightgbm_quantile"
feature_set = "in_call_clock"
role = "ablation"

[candidates.params]
num_boost_round = 300
early_stopping_rounds = 30
learning_rate = 0.03
num_leaves = 15
min_data_in_leaf = 10
max_depth = 6
lambda_l2 = 1.0
feature_fraction = 1.0
bagging_fraction = 1.0
bagging_freq = 0

[candidates.ablation]
reference_candidate_id = "in_call_model"
axis = "feature_set"
allowed_config_paths = ["feature_set"]

[[candidates]]
id = "task_update_model"
estimator = "lightgbm_quantile"
feature_set = "task_update_selected"
role = "model"

[candidates.params]
num_boost_round = 300
early_stopping_rounds = 30
learning_rate = 0.03
num_leaves = 15
min_data_in_leaf = 10
max_depth = 6
lambda_l2 = 1.0
feature_fraction = 1.0
bagging_fraction = 1.0
bagging_freq = 0

[[experiments]]
id = "task_initialization"
position = "task_launch"
target = "task_total_accounted_tokens"
candidates = ["empirical_quantile", "task_launch_model"]
required_features = ["task_char_count"]
token_unit_contract_id = "provider:dsh-outputTokens-v1:openai-codex:gpt-5.4"

[[experiments]]
id = "call_start"
position = "call_pre"
target = "call_billable_output_tokens"
candidates = ["empirical_quantile", "call_start_model"]
required_features = ["task_char_count"]
token_unit_contract_id = "provider:dsh-outputTokens-v1:openai-codex:gpt-5.4"

[[experiments]]
id = "in_call_billed"
position = "call_update"
target = "attempt_provider_final_output_tokens"
candidates = ["empirical_quantile", "in_call_model", "in_call_clock"]
required_features = ["task_char_count"]
token_unit_contract_id = "provider:dsh-outputTokens-v1:openai-codex:gpt-5.4"

[[experiments]]
id = "in_call_visible"
position = "call_update"
target = "attempt_observer_remaining_visible_output_tokens"
candidates = ["empirical_quantile", "in_call_model", "in_call_clock"]
required_features = ["task_char_count"]
token_unit_contract_id = "observer:utf8-bytes-v1"

[[experiments]]
id = "task_update"
position = "task_update"
target = "task_provider_accounted_remaining_tokens"
candidates = ["empirical_quantile", "task_update_model"]
required_features = ["task_char_count"]
token_unit_contract_id = "provider:dsh-outputTokens-v1:openai-codex:gpt-5.4"
