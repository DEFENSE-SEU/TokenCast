config_id = "call-start-ensemble-refinement-v9"
schema_version = 2
workspace = "workspace"
seed = 20260719

[collection]
source = "dsh_session_observer_v2"
dataset = "hierarchical"
descriptor_path = "configs/source_descriptors/dsh_session_observer_v2.json"

[split]
unit = "task_id"
folds = 5

[interval]
alpha = 0.10
calibrator = "task_max_conformal"

[feature_sets.none]
include_all = false

[feature_sets.call_selected_legacy]
include_all = false
include_subgroups = ["current_progress", "token_history", "progress_change"]
exclude_features = [
  "last_call_read_result_chars",
  "last_call_edit_result_chars",
  "last_call_run_result_chars",
  "last_call_test_result_chars",
  "last_call_tracking_result_chars",
]

[feature_sets.call_content_read]
include_all = false
include_subgroups = ["current_progress", "token_history", "progress_change"]
exclude_features = [
  "last_call_edit_result_chars",
  "last_call_run_result_chars",
  "last_call_test_result_chars",
  "last_call_tracking_result_chars",
]

[[candidates]]
id = "empirical"
estimator = "empirical_quantile"
feature_set = "none"
role = "baseline"

[candidates.params]
alpha = 0.10

[[candidates]]
id = "call_full"
estimator = "lightgbm_quantile"
feature_set = "call_selected_legacy"
role = "model"

[candidates.params]
num_boost_round = 300
early_stopping_rounds = 30
learning_rate = 0.03
num_leaves = 15
min_data_in_leaf = 10
max_depth = 6
lambda_l2 = 1.0
feature_fraction = 1.0
bagging_fraction = 1.0
bagging_freq = 0

[[candidates]]
id = "call_sub"
estimator = "lightgbm_quantile"
feature_set = "call_selected_legacy"
role = "ablation"

[candidates.params]
num_boost_round = 400
early_stopping_rounds = 35
learning_rate = 0.025
num_leaves = 15
min_data_in_leaf = 10
max_depth = 6
lambda_l2 = 1.0
feature_fraction = 0.8
bagging_fraction = 0.8
bagging_freq = 1

[candidates.ablation]
reference_candidate_id = "call_full"
axis = "method"
allowed_config_paths = [
  "params.num_boost_round",
  "params.early_stopping_rounds",
  "params.learning_rate",
  "params.feature_fraction",
  "params.bagging_fraction",
  "params.bagging_freq",
]

[[candidates]]
id = "call_read"
estimator = "lightgbm_quantile"
feature_set = "call_content_read"
role = "ablation"

[candidates.params]
num_boost_round = 300
early_stopping_rounds = 30
learning_rate = 0.03
num_leaves = 15
min_data_in_leaf = 10
max_depth = 6
lambda_l2 = 1.0
feature_fraction = 1.0
bagging_fraction = 1.0
bagging_freq = 0

[candidates.ablation]
reference_candidate_id = "call_full"
axis = "feature_set"
allowed_config_paths = ["feature_set"]

[[candidates]]
id = "call_read_sub"
estimator = "lightgbm_quantile"
feature_set = "call_content_read"
role = "ablation"

[candidates.params]
num_boost_round = 400
early_stopping_rounds = 35
learning_rate = 0.025
num_leaves = 15
min_data_in_leaf = 10
max_depth = 6
lambda_l2 = 1.0
feature_fraction = 0.8
bagging_fraction = 0.8
bagging_freq = 1

[candidates.ablation]
reference_candidate_id = "call_read"
axis = "method"
allowed_config_paths = [
  "params.num_boost_round",
  "params.early_stopping_rounds",
  "params.learning_rate",
  "params.feature_fraction",
  "params.bagging_fraction",
  "params.bagging_freq",
]

[[experiments]]
id = "call_start"
position = "call_pre"
target = "call_billable_output_tokens"
candidates = [
  "empirical",
  "call_full",
  "call_sub",
  "call_read",
  "call_read_sub",
]
required_features = ["task_char_count"]
