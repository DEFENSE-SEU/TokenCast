config_id = "multi-position-baselines-v2"
schema_version = 2
workspace = "workspace"
seed = 20260719

[collection]
source = "canonical_jsonl"

[split]
unit = "task_id"
folds = 5

[interval]
alpha = 0.10
calibrator = "task_max_conformal"

[feature_sets.none]
include_all = false

[feature_sets.request_length_only]
include_all = false
include_features = ["current_request_tokens_local"]

[feature_sets.task_length_only]
include_all = false
include_features = ["task_tokens"]

[[candidates]]
id = "empirical_quantile"
estimator = "empirical_quantile"
feature_set = "none"
role = "baseline"

[candidates.params]
alpha = 0.10

[[candidates]]
id = "length_only"
estimator = "length_only"
feature_set = "request_length_only"
role = "baseline"

[candidates.params]
feature_name = "current_request_tokens_local"
alpha = 0.10

[[candidates]]
id = "task_length_only"
estimator = "length_only"
feature_set = "task_length_only"
role = "baseline"

[candidates.params]
feature_name = "task_tokens"
alpha = 0.10

[[experiments]]
id = "task_launch_total"
position = "task_launch"
target = "task_total_accounted_tokens"
candidates = ["empirical_quantile", "task_length_only"]
required_features = ["task_tokens"]

[[experiments]]
id = "task_update_unknown_remaining"
position = "task_update"
target = "task_unknown_remaining_tokens"
candidates = ["empirical_quantile", "length_only"]
required_features = ["current_request_tokens_local"]

[[experiments]]
id = "call_pre_unknown_billable"
position = "call_pre"
target = "call_unknown_billable_tokens"
candidates = ["empirical_quantile", "length_only"]
required_features = ["current_request_tokens_local"]
