config_id = "in-call-output-composition-v2"
schema_version = 2
workspace = "workspace"
seed = 20260719

[collection]
source = "dsh_session_observer_v2"
dataset = "hierarchical"
descriptor_path = "configs/source_descriptors/dsh_session_observer_v2.json"

[split]
unit = "task_id"
folds = 5
authority_path = "configs/splits/dsh_historical_development_v1.json"

[interval]
alpha = 0.1
calibrator = "point_conformal"

[feature_sets.clock]
include_all = false
include_subgroups = ["cumulative_history", "current_progress", "token_history", "progress_change", "prefix_closure", "session_recall", "stream_clock"]
include_features = ["generation_prefix_embedding"]
exclude_features = ["last_call_argument_chars", "last_call_observation_chars"]

[feature_sets.composition]
include_all = false
include_subgroups = ["cumulative_history", "current_progress", "token_history", "progress_change", "prefix_closure", "session_recall", "stream_clock"]
include_features = ["generation_prefix_embedding", "prefix_char_count", "prefix_word_count", "prefix_word_chars", "prefix_digit_count", "prefix_whitespace_count", "prefix_punctuation_count", "prefix_nonascii_count", "prefix_utf8_per_char", "prefix_mean_word_chars"]
exclude_features = ["last_call_argument_chars", "last_call_observation_chars"]

[feature_sets.composition_tail]
include_all = false
include_subgroups = ["cumulative_history", "current_progress", "token_history", "progress_change", "prefix_closure", "session_recall", "stream_clock"]
include_features = ["generation_prefix_embedding", "generation_prefix_tail_embedding", "generation_prefix_tail_char_embedding", "prefix_char_count", "prefix_word_count", "prefix_word_chars", "prefix_digit_count", "prefix_whitespace_count", "prefix_punctuation_count", "prefix_nonascii_count", "prefix_utf8_per_char", "prefix_mean_word_chars"]
exclude_features = ["last_call_argument_chars", "last_call_observation_chars"]

[feature_sets.composition_delta]
include_all = false
include_subgroups = ["cumulative_history", "current_progress", "token_history", "progress_change", "prefix_closure", "session_recall", "stream_clock"]
include_features = ["generation_prefix_embedding", "generation_delta_embedding", "prefix_char_count", "prefix_word_count", "prefix_word_chars", "prefix_digit_count", "prefix_whitespace_count", "prefix_punctuation_count", "prefix_nonascii_count", "prefix_utf8_per_char", "prefix_mean_word_chars"]
exclude_features = ["last_call_argument_chars", "last_call_observation_chars"]

[[candidates]]
id = "output_clock"
estimator = "lightgbm_quantile"
feature_set = "clock"
role = "model"

[candidates.params]
num_boost_round = 300
early_stopping_rounds = 30
learning_rate = 0.03
num_leaves = 15
min_data_in_leaf = 10
max_depth = 6
lambda_l2 = 1.0
feature_fraction = 1.0
bagging_fraction = 1.0
bagging_freq = 0

