position = "call_update"
target = "attempt_observer_remaining_visible_output_tokens"
candidates = [
  "empirical_quantile",
  "ic_selected",
  "ic_task_raw",
  "ic_task_knn",
  "ic_row_knn_20",
  "ic_row_knn_40",
  "ic_task_knn_weighted",
  "ic_task_knn_label_shuffle",
  "ic_task_knn_neighbor_shuffle",
]
required_features = ["task_char_count", "task_embedding"]
token_unit_contract_id = "observer:utf8-bytes-v1"

[[experiments]]
id = "task_update"
position = "task_update"

target = "task_provider_accounted_remaining_tokens"
candidates = [
  "empirical_quantile",
  "tu_selected",
  "tu_task_raw",
  "tu_task_knn",
  "tu_row_knn_20",
  "tu_row_knn_40",
  "tu_task_knn_weighted",
  "tu_task_knn_label_shuffle",
  "tu_task_knn_neighbor_shuffle",
]
required_features = ["task_char_count", "task_embedding"]
token_unit_contract_id = "provider:dsh-outputTokens-v1:openai-codex:gpt-5.4"

[[sweeps]]
id = "ic-neighbors"
experiment = "in_call_update"
base_candidate = "ic_task_knn"
param = "retrieval_neighbors"
values = [5, 10, 20, 999]

[[sweeps]]
