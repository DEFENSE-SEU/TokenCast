config_id = "call-start-content-source-refinement-v7"
schema_version = 2
workspace = "workspace"
seed = 20260719

[collection]
source = "dsh_session_observer_v2"
dataset = "hierarchical"
descriptor_path = "configs/source_descriptors/dsh_session_observer_v2.json"

[split]
unit = "task_id"
folds = 5

[interval]
alpha = 0.10
calibrator = "task_max_conformal"

[feature_sets.none]
include_all = false

[feature_sets.call_selected_legacy]
include_all = false
include_subgroups = ["current_progress", "token_history", "progress_change"]
exclude_features = [
  "last_call_read_result_chars",
  "last_call_edit_result_chars",
  "last_call_run_result_chars",
  "last_call_test_result_chars",
  "last_call_tracking_result_chars",
]

[feature_sets.call_content_read]
include_all = false
include_subgroups = ["current_progress", "token_history", "progress_change"]
exclude_features = [
  "last_call_edit_result_chars",
  "last_call_run_result_chars",
  "last_call_test_result_chars",
  "last_call_tracking_result_chars",
]

[feature_sets.call_content_execution]
include_all = false
include_subgroups = ["current_progress", "token_history", "progress_change"]
exclude_features = [
  "last_call_read_result_chars",
  "last_call_edit_result_chars",
  "last_call_tracking_result_chars",
]

[feature_sets.call_content_edit_tracking]
include_all = false
include_subgroups = ["current_progress", "token_history", "progress_change"]
exclude_features = [
  "last_call_read_result_chars",
  "last_call_run_result_chars",
  "last_call_test_result_chars",
]

[feature_sets.call_content_all]
include_all = false
include_subgroups = ["current_progress", "token_history", "progress_change"]

[[candidates]]
id = "empirical_quantile"
estimator = "empirical_quantile"
feature_set = "none"
role = "baseline"

[candidates.params]
alpha = 0.10

[[candidates]]
id = "call_selected_legacy"
estimator = "lightgbm_quantile"
feature_set = "call_selected_legacy"
role = "model"

[candidates.params]
num_boost_round = 300
early_stopping_rounds = 30
learning_rate = 0.03
num_leaves = 15
min_data_in_leaf = 10
max_depth = 6
lambda_l2 = 1.0
feature_fraction = 1.0
bagging_fraction = 1.0
bagging_freq = 0

[[candidates]]
id = "call_content_read"
estimator = "lightgbm_quantile"
feature_set = "call_content_read"
role = "ablation"

[candidates.params]
num_boost_round = 300
early_stopping_rounds = 30
learning_rate = 0.03
num_leaves = 15
min_data_in_leaf = 10
max_depth = 6
lambda_l2 = 1.0
feature_fraction = 1.0
bagging_fraction = 1.0
bagging_freq = 0

[candidates.ablation]
reference_candidate_id = "call_selected_legacy"
axis = "feature_set"
allowed_config_paths = ["feature_set"]

