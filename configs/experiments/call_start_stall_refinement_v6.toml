config_id = "call-start-stall-refinement-v6"
schema_version = 2
workspace = "workspace"
seed = 20260719

[collection]
source = "dsh_session_observer_v2"
dataset = "hierarchical"
descriptor_path = "configs/source_descriptors/dsh_session_observer_v2.json"

[split]
unit = "task_id"
folds = 5

[interval]
alpha = 0.10
calibrator = "task_max_conformal"

[feature_sets.none]
include_all = false

[feature_sets.call_selected]
include_all = false
include_subgroups = ["current_progress", "token_history", "progress_change"]

[feature_sets.call_no_progress]
include_all = false
include_subgroups = ["current_progress", "token_history", "progress_change"]
include_features = ["consecutive_no_progress_calls"]

[feature_sets.call_repeated_action]
include_all = false
include_subgroups = ["current_progress", "token_history", "progress_change"]
include_features = ["repeated_action_count_3"]

[feature_sets.call_read_actions]
include_all = false
include_subgroups = ["current_progress", "token_history", "progress_change"]
include_features = ["cumulative_read_actions"]

[feature_sets.call_stall_compact]
include_all = false
include_subgroups = ["current_progress", "token_history", "progress_change"]
include_features = [
  "consecutive_no_progress_calls",
  "repeated_action_count_3",
  "cumulative_read_actions",
]

[[candidates]]
id = "empirical_quantile"
estimator = "empirical_quantile"
feature_set = "none"
role = "baseline"

[candidates.params]
alpha = 0.10

[[candidates]]
id = "call_selected"
estimator = "lightgbm_quantile"
feature_set = "call_selected"
role = "model"

[candidates.params]
num_boost_round = 300
early_stopping_rounds = 30
learning_rate = 0.03
num_leaves = 15
min_data_in_leaf = 10
max_depth = 6
lambda_l2 = 1.0
feature_fraction = 1.0
bagging_fraction = 1.0
bagging_freq = 0

[[candidates]]
id = "call_no_progress"
estimator = "lightgbm_quantile"
feature_set = "call_no_progress"
role = "ablation"

[candidates.params]
num_boost_round = 300
early_stopping_rounds = 30
learning_rate = 0.03
num_leaves = 15
min_data_in_leaf = 10
max_depth = 6
lambda_l2 = 1.0
feature_fraction = 1.0
bagging_fraction = 1.0
