config_id = "in-call-billed-information-ablation-v1"
schema_version = 2
workspace = "workspace"
seed = 20260719


[collection]
source = "dsh_session_observer_v2"
dataset = "hierarchical"
descriptor_path = "configs/source_descriptors/dsh_session_observer_v2.json"

[split]
unit = "task_id"
folds = 5

[interval]
alpha = 0.10
calibrator = "point_conformal"

[feature_sets.none]
include_all = false

[feature_sets.ic_billed_ref]
include_all = false
include_subgroups = ["cumulative_history", "current_progress", "token_history", "progress_change", "prefix_closure", "session_recall", "stream_clock"]
include_features = ["generation_prefix_embedding"]
exclude_features = ["last_call_argument_chars", "last_call_observation_chars"]

[feature_sets.ic_billed_without_token_history]
include_all = false
include_subgroups = ["cumulative_history", "current_progress", "progress_change", "prefix_closure", "session_recall", "stream_clock"]
