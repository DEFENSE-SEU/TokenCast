config_id = "in-call-prefix-intent-v1"
schema_version = 2
workspace = "workspace"
seed = 20260719


[collection]
source = "dsh_session_observer_v2"
dataset = "hierarchical"
descriptor_path = "configs/source_descriptors/dsh_session_observer_v2.json"

[split]
unit = "task_id"
folds = 5

[interval]
alpha = 0.10
calibrator = "task_max_conformal"

[feature_sets.none]
include_all = false

[feature_sets.blackbox]
include_all = true
exclude_subgroups = ["raw_text", "context_text", "entropy_stop", "hidden_state", "stream_clock"]


[feature_sets.blackbox_prefix_embedding]
include_all = true
exclude_subgroups = ["context_text", "entropy_stop", "hidden_state", "stream_clock"]
exclude_features = [
  "task_text",
  "visible_text_prefix",
  "prefix_open_code_fence",
  "prefix_code_fence_count",
  "prefix_open_list_item",
  "prefix_last_line_chars",
  "prefix_ends_sentence",
  "prefix_ends_colon",
  "prefix_line_count",
  "prefix_tail_continuation_markers",
  "prefix_tail_wrapup_markers",
]

[feature_sets.blackbox_prefix_intent]
include_all = true
exclude_subgroups = ["context_text", "entropy_stop", "hidden_state", "stream_clock"]
exclude_features = ["task_text", "visible_text_prefix", "generation_prefix_embedding"]

[feature_sets.blackbox_prefix_text]
include_all = true
exclude_subgroups = ["context_text", "entropy_stop", "hidden_state", "stream_clock"]
exclude_features = ["task_text", "visible_text_prefix"]

[feature_sets.generation_accounting]
include_all = false
include_features = [
  "attempt_accounting_prior_q05",
  "attempt_accounting_prior_q50",
  "attempt_accounting_prior_q95",
]

[[candidates]]
id = "empirical_quantile"
estimator = "empirical_quantile"
feature_set = "none"
role = "baseline"

[candidates.params]
alpha = 0.10

[[candidates]]
id = "generation_accounting_prior"
estimator = "quantile_features"
feature_set = "generation_accounting"
role = "baseline"

[candidates.params]
lower_feature = "attempt_accounting_prior_q05"
point_feature = "attempt_accounting_prior_q50"
upper_feature = "attempt_accounting_prior_q95"

[candidates.initializer_params]
alpha = 0.10

[candidates.graph]
initializer = "empirical_quantile"
updater = "quantile_features"
lifecycle_schema = "attempt_generation_residual_v1"
seed_policy = "inner_oof_uncalibrated_repaired_quantile_mean_v1"
inner_split_policy = "task_multicohort_balanced_inner_oof_v2"

[[candidates]]
id = "generation_residual_mlp"
estimator = "independent_mlp"
feature_set = "blackbox"
role = "model"

[candidates.params]
hidden_dims = [128, 64]
learning_rate = 0.001
weight_decay = 0.0001
max_epochs = 100
patience = 12
output_transform = "attempt_accounting_residual"
residual_scale = 1.0
training_device = "cpu"

[candidates.initializer_params]
alpha = 0.10

