config_id = "in-call-billed-closure-probe-v1"
schema_version = 2
workspace = "workspace"
seed = 20260719


[collection]
source = "dsh_session_observer_v2"
dataset = "hierarchical"
descriptor_path = "configs/source_descriptors/dsh_session_observer_v2.json"

[split]
unit = "task_id"
folds = 5

[interval]
alpha = 0.10
calibrator = "point_conformal"

[feature_sets.ic_billed_with_closure_no_embedding]
include_all = false
include_subgroups = ["cumulative_history", "current_progress", "token_history", "progress_change", "prefix_closure", "session_recall", "stream_clock"]
exclude_features = ["last_call_argument_chars", "last_call_observation_chars"]

[[candidates]]
id = "ic_billed_with_closure_no_embedding"
estimator = "lightgbm_quantile"
feature_set = "ic_billed_with_closure_no_embedding"
role = "model"

[candidates.params]
num_boost_round = 300
early_stopping_rounds = 30
learning_rate = 0.03
num_leaves = 15
min_data_in_leaf = 10
max_depth = 6
lambda_l2 = 1.0
feature_fraction = 1.0
bagging_fraction = 1.0
bagging_freq = 0

[[experiments]]
id = "in_call_billed"
position = "call_update"
target = "attempt_provider_final_output_tokens"
token_unit_contract_id = "provider:dsh-outputTokens-v1:openai-codex:gpt-5.4"
candidates = ["ic_billed_with_closure_no_embedding"]
required_features = ["observer_committed_tokens"]
