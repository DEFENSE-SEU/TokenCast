subset = "opus-pro"
split = "train"
license = "MIT"
url = "https://huggingface.co/datasets/netpreme/coding_agent_traces/resolve/d56ae0d0bc80f3663a7a61a38c4ee60c26ce7b67/opus-pro/train-00000-of-00001.parquet"
local_path = "workspace/external/public_trajectory_validation/source.parquet"
sha256 = "3071c2ea1b5a8104c0caa6378c9446b02c7c1d7335a00054a59b2ac21e58c0df"
token_unit_contract_id = "provider-output-token-v1"

[task_metadata]
dataset = "ScaleAI/SWE-bench_Pro"
revision = "7ab5114912baf22bb098818e604c02fe7ad2c11f"
subset = "default"
split = "test"
url = "https://huggingface.co/datasets/ScaleAI/SWE-bench_Pro/resolve/7ab5114912baf22bb098818e604c02fe7ad2c11f/data/test-00000-of-00001.parquet"
