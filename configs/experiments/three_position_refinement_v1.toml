config_id = "three-position-refinement-v1"
schema_version = 2
workspace = "workspace"
seed = 20260719

[collection]
source = "dsh_session_observer_v2"
dataset = "hierarchical"
descriptor_path = "configs/source_descriptors/dsh_session_observer_v2.json"

[split]
unit = "task_id"
folds = 5

[interval]
alpha = 0.10
calibrator = "task_max_conformal"

[feature_sets.none]
include_all = false

[feature_sets.call_current]
include_all = false
include_subgroups = [
  "initial_info",
  "current_progress",
  "failure_stall",
  "token_history",
  "progress_change",
]

[feature_sets.call_count]
include_all = false
include_subgroups = [
  "initial_info",
  "current_progress",
  "failure_stall",
  "token_history",
  "progress_change",
]
include_features = ["completed_call_count"]

[feature_sets.call_no_stall]
include_all = false
include_subgroups = [
  "initial_info",
  "current_progress",
  "token_history",
  "progress_change",
]

[feature_sets.call_compact]
include_all = false
include_subgroups = [
  "initial_info",
  "current_progress",
  "token_history",
  "progress_change",
]
include_features = ["completed_call_count"]

[feature_sets.in_call_current]
include_all = false
include_subgroups = [
  "cumulative_history",
  "current_progress",
  "failure_stall",
  "token_history",
  "progress_change",
]

[feature_sets.in_call_prefix]
include_all = false
include_subgroups = [
  "cumulative_history",
  "current_progress",
  "failure_stall",
  "token_history",
  "progress_change",
]
include_features = ["generation_prefix_embedding"]

[feature_sets.in_call_no_stall]
include_all = false
include_subgroups = [
  "cumulative_history",
  "current_progress",
  "token_history",
  "progress_change",
]

[feature_sets.in_call_prefix_no_stall]
include_all = false
include_subgroups = [
  "cumulative_history",
  "current_progress",
  "token_history",
  "progress_change",
]
include_features = ["generation_prefix_embedding"]

[[candidates]]
id = "empirical_quantile"
estimator = "empirical_quantile"
feature_set = "none"
role = "baseline"

[candidates.params]
alpha = 0.10

[[candidates]]
id = "call_current"
estimator = "lightgbm_quantile"
feature_set = "call_current"
role = "model"

[candidates.params]
num_boost_round = 300
early_stopping_rounds = 30
learning_rate = 0.03
num_leaves = 15
min_data_in_leaf = 10
max_depth = 6
lambda_l2 = 1.0
feature_fraction = 1.0
bagging_fraction = 1.0
bagging_freq = 0

[[candidates]]
id = "call_count"
estimator = "lightgbm_quantile"
feature_set = "call_count"
role = "ablation"

