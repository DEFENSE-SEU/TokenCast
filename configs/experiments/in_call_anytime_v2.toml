config_id = "in-call-anytime-v2"
schema_version = 2
workspace = "workspace"
seed = 20260719


[collection]
source = "dsh_session_observer_v2"
dataset = "hierarchical"
descriptor_path = "configs/source_descriptors/dsh_session_observer_v2.json"
tick_seconds = 1.0

[split]
unit = "task_id"
folds = 5

[interval]
alpha = 0.10
calibrator = "task_max_conformal"


[feature_sets.none]
include_all = false

[feature_sets.arrival_driven]
include_all = false
include_subgroups = [
  "cumulative_history",
  "current_progress",
  "token_history",
  "progress_change",
]
include_features = ["generation_prefix_embedding"]
exclude_features = ["last_call_argument_chars", "last_call_observation_chars"]

[feature_sets.time_driven]
include_all = false
include_subgroups = [
  "cumulative_history",
  "current_progress",
  "token_history",
  "progress_change",
  "stream_clock",
]
include_features = ["generation_prefix_embedding"]
exclude_features = ["last_call_argument_chars", "last_call_observation_chars"]

[feature_sets.frozen_clock]
include_all = false
include_subgroups = [
  "cumulative_history",
  "current_progress",
  "token_history",
  "progress_change",
  "frozen_clock",
]
include_features = ["generation_prefix_embedding"]
exclude_features = ["last_call_argument_chars", "last_call_observation_chars"]

[[candidates]]
id = "empirical_quantile"
estimator = "empirical_quantile"
feature_set = "none"
role = "baseline"

[candidates.params]
alpha = 0.10

[[candidates]]
id = "arrival_driven"
estimator = "lightgbm_quantile"
feature_set = "arrival_driven"
role = "model"

[candidates.params]
num_boost_round = 300
early_stopping_rounds = 30
learning_rate = 0.03
num_leaves = 15
min_data_in_leaf = 10
max_depth = 6
lambda_l2 = 1.0
feature_fraction = 1.0
bagging_fraction = 1.0
bagging_freq = 0

[[candidates]]
id = "frozen_clock"
estimator = "lightgbm_quantile"
feature_set = "frozen_clock"
role = "ablation"

[candidates.params]
num_boost_round = 300
early_stopping_rounds = 30
learning_rate = 0.03
num_leaves = 15
min_data_in_leaf = 10
max_depth = 6
lambda_l2 = 1.0
feature_fraction = 1.0
bagging_fraction = 1.0
bagging_freq = 0

[candidates.ablation]
reference_candidate_id = "arrival_driven"
axis = "feature_set"
allowed_config_paths = ["feature_set"]

[[candidates]]
id = "time_driven"
estimator = "lightgbm_quantile"
feature_set = "time_driven"
role = "ablation"

[candidates.params]
num_boost_round = 300
early_stopping_rounds = 30
learning_rate = 0.03
num_leaves = 15
min_data_in_leaf = 10
max_depth = 6
lambda_l2 = 1.0
feature_fraction = 1.0
bagging_fraction = 1.0
bagging_freq = 0

[candidates.ablation]
reference_candidate_id = "arrival_driven"
axis = "feature_set"
allowed_config_paths = ["feature_set"]

[[experiments]]
id = "in_call_anytime"
position = "call_update"
target = "attempt_provider_final_output_tokens"
candidates = ["empirical_quantile", "arrival_driven", "frozen_clock", "time_driven"]
required_features = ["task_char_count"]
token_unit_contract_id = "provider:dsh-outputTokens-v1:openai-codex:gpt-5.4"
