- id: llm-pi-ai
  disabled: !!js process.env.DSH_PROVIDER !== 'qwen-compatible'
  config:
    providers:
      qwen-compatible:
        displayName: Hosted OpenAI-compatible
        apiKeyEnv: !!js process.env.DSH_API_KEY_ENV || 'QWEN_API_KEY'
        api: openai-completions
        baseURL: !!js process.env.DSH_BASE_URL
        defaultContextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW || '131072')
        defaultMaxTokens: !!js Number(process.env.DSH_MAX_TOKENS_CEILING || '8192')
        defaultInput: [text]
        transport: sse
        timeoutMs: 300000
        streamIdleTimeoutMs: 300000
        compat:
          supportsUsageInStreaming: true
          maxTokensField: max_tokens
        models:
          - id: !!js process.env.DSH_MODEL || 'qwen3-235b-a22b-instruct-2507'
            name: !!js process.env.DSH_MODEL || 'qwen3-235b-a22b-instruct-2507'
            contextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW || '131072')
            maxTokens: !!js Number(process.env.DSH_MAX_TOKENS_CEILING || '8192')
            input: [text]


            reasoningEfforts: !!js "new RegExp('^(?:anthropic/)?claude-', 'i').test(process.env.DSH_MODEL || '') ? false : new RegExp('^(?:google/)?gemini-', 'i').test(process.env.DSH_MODEL || '') ? { off: 'none', minimal: 'minimal', low: 'low', medium: 'medium', high: 'high' } : new RegExp('^(?:(?:moonshotai/)?kimi-|(?:deepseek/)?deepseek-v4-)', 'i').test(process.env.DSH_MODEL || '') ? { off: 'none', high: 'high' } : { off: null, low: 'low' }"
            compat:
              maxTokensField: !!js "new RegExp('^(?:openai/)?gpt-5\\.4$', 'i').test(process.env.DSH_MODEL || '') && process.env.DSH_REASONING_EFFORT === 'low' ? 'max_completion_tokens' : 'max_tokens'"
              supportsDeveloperRole: false
              supportsReasoningEffort: !!js "!new RegExp('^(?:(?:moonshotai/)?kimi-|(?:anthropic/)?claude-)', 'i').test(process.env.DSH_MODEL || '')"
              requiresReasoningContentOnAssistantMessages: !!js "new RegExp('^(?:(?:moonshotai/)?kimi-|(?:deepseek/)?deepseek-v4-)', 'i').test(process.env.DSH_MODEL || '')"
              thinkingFormat: !!js "new RegExp('^(?:(?:google/)?gemini-|(?:anthropic/)?claude-)', 'i').test(process.env.DSH_MODEL || '') || (new RegExp('^(?:openai/)?gpt-5\\.4$', 'i').test(process.env.DSH_MODEL || '') && process.env.DSH_REASONING_EFFORT === 'low') ? 'openai' : new RegExp('^(?:(?:moonshotai/)?kimi-|(?:deepseek/)?deepseek-v4-)', 'i').test(process.env.DSH_MODEL || '') ? 'deepseek' : 'qwen'"
        retryPolicy:
          mode: normal
          maxRetries: !!js Number(process.env.DSH_MAX_RETRIES || '1')
          retryableCodes:
            - EMPTY_RESPONSE
            - RATE_LIMIT
            - SERVER
            - TIMEOUT
            - TRANSPORT
          backoff:
            initialDelayMs: 500
            maxDelayMs: 10000
            jitterRatio: 0

